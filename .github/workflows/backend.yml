name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: CI — type-check, build, test
  # ─────────────────────────────────────────────
  ci:
    name: CI (type-check · build · test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test

  # ─────────────────────────────────────────────
  # Job 2: CD — deploy to Vercel
  # Runs only on push (not on pull_request)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@37

      # Write .vercel/project.json at repo root — this is where Vercel CLI looks
      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" \
            "${{ secrets.VERCEL_ORG_ID }}" \
            > .vercel/project.json
          cat .vercel/project.json

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy ./backend --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel deploy ./backend --token=${{ secrets.VERCEL_TOKEN }}
